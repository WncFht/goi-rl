name: Research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
      - run: python scripts/run_checks.py --config scripts/checks.json --mode ci
      - name: Scan repository for credentials
        run: |
          curl --fail --location --retry 3 --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --retry 3 --output /tmp/checksums.txt \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          cd /tmp
          mv gitleaks.tar.gz gitleaks_8.30.1_linux_x64.tar.gz
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git . --redact --no-banner
