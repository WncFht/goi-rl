default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^sources/
repos:
  - repo: local
    hooks:
      - id: prose-format
        name: Format staged Markdown and configuration
        stages: [manual]
        entry: node_modules/.bin/git-format-staged --formatter "node_modules/.bin/prettier --stdin-filepath {}"
        language: system
        files: '\.(md|yaml|yml|json|jsonc)$'
        exclude: ^package-lock\.json$|^\.agents/notes/archived/
      - id: python-format
        name: Format staged Python
        stages: [manual]
        entry: node_modules/.bin/git-format-staged --formatter "ruff format --stdin-filename {} -"
        language: system
        types: [python]
      - id: python-lint
        name: Python lint
        entry: ruff check
        language: system
        types: [python]
      - id: markdown-lint
        name: Markdown lint
        entry: node_modules/.bin/markdownlint-cli2
        language: system
        types: [markdown]
      - id: staged-contracts
        name: Staged document and research contracts
        entry: python3 scripts/staged_checks.py
        language: system
        pass_filenames: false
        always_run: true
      - id: secrets
        name: Staged secrets
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
      - id: maintenance
        name: Full checks before push
        entry: python3 scripts/run_checks.py --config scripts/checks.json --mode ci
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
